<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700"><rect width="100%" height="100%" fill="#111212"/><text x="65" y="90" font-family="Arial,sans-serif" font-size="30" fill="#f1eee8" letter-spacing="9">VELETO</text><text x="65" y="200" fill="#c7a48e" font-family="Georgia,serif" font-size="60">Make a little room.</text><text x="65" y="300" font-family="Arial,sans-serif" font-size="20" fill="#c7a48e" >CAPTURE</text><text x="65" y="342" font-family="Arial,sans-serif" font-size="24" fill="#f1eee8" >Put three thoughts on the page. Leave room around them.</text><text x="65" y="420" font-family="Arial,sans-serif" font-size="20" fill="#c7a48e" >CONNECT</text><text x="65" y="462" font-family="Arial,sans-serif" font-size="24" fill="#f1eee8" >Draw a line between two ideas that belong together.</text><text x="65" y="540" font-family="Arial,sans-serif" font-size="20" fill="#c7a48e" >CHOOSE</text><text x="65" y="582" font-family="Arial,sans-serif" font-size="24" fill="#f1eee8" >Circle one small next step. Begin there.</text><text x="65" y="655" font-family="Arial,sans-serif" font-size="15" fill="#b8b5ae" letter-spacing="3">WHERE THOUGHTS TAKE SHAPE.</text></svg>